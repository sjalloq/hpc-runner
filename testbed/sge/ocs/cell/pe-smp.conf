# The smp parallel environment, as in the soge flavour; OCS 9.1.7's PE has
# no qsort_args and adds the three *_forks_slaves/ign_sreq_on_mhost fields.
pe_name              smp
slots                999
user_lists           NONE
xuser_lists          NONE
start_proc_args      NONE
stop_proc_args       NONE
allocation_rule      $pe_slots
control_slaves       FALSE
job_is_first_task    TRUE
urgency_slots        min
accounting_summary   FALSE
ign_sreq_on_mhost    FALSE
master_forks_slaves  FALSE
daemon_forks_slaves  FALSE
