# One file for every flavour. IgnoreSystemd: there is no systemd or dbus in the
# containers, so slurmd makes its own cgroup directories. ConstrainDevices
# stays off: the fake GPU's device is /dev/null (gres.conf).
CgroupPlugin=cgroup/v2
IgnoreSystemd=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
AllowedSwapSpace=0
ConstrainCores=yes
