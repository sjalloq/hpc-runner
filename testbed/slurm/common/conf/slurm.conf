# Slurm testbed. Unprivileged containers: no cgroups, no task plugin.
ClusterName=testbed
SlurmctldHost=master
AuthType=auth/munge
CredType=cred/munge
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
MpiDefault=none
ReturnToService=2
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerCPU=100
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=master
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
MailProg=/bin/true
# Something for each kind of request to name: a licence, a feature, a GPU,
# temp disk.
Licenses=lic:2
GresTypes=gpu
SlurmctldDebug=info
SlurmdDebug=info
NodeName=exec1 CPUs=2 RealMemory=2000 TmpDisk=1000 Feature=fast Gres=gpu:1 State=UNKNOWN
NodeName=exec2 CPUs=2 RealMemory=2000 TmpDisk=1000 State=UNKNOWN
PartitionName=all Nodes=exec[1-2] Default=YES MaxTime=INFINITE State=UP
PartitionName=short Nodes=exec[1-2] MaxTime=00:10:00 State=UP
