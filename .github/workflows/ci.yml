name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/hpc_runner tests

      - name: Ruff format
        run: ruff format --check src/hpc_runner tests

      - name: Mypy
        run: mypy src/hpc_runner

      # The docs build is part of lint: warnings (broken references, bad
      # markup) fail the build, as in the Pages workflow.
      - name: Docs
        run: make -C docs html SPHINXOPTS="-W --keep-going"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for hatch-vcs

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install environment-modules
        run: sudo apt-get update && sudo apt-get install -y environment-modules

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # End-to-end tests against a real scheduler: the Docker Compose stacks in
  # testbed/<scheduler>/<flavour> (docs/dev/testbed/TESTBED_PLAN.md section 7,
  # testbed/README.md "CI").
  # SGE: soge (gridengine 8.1.9) runs at every Python; ocs (Open Cluster
  # Scheduler 9.1.7) at 3.12 only, since its differences are in what the
  # scheduler writes, not in the Python that reads it.
  # Slurm: 24.11 and 22.05 at 3.12 only, for the same reason. Their exec
  # containers are privileged (slurmd runs jobs in cgroups).
  # The image is built in the job; there is no registry. If the build ever
  # hurts, the first step up is docker/build-push-action with
  # cache-from/to: type=gha, still with no registry.
  #
  # Pull requests run soge at Python 3.12 only; pushes to main run soge at
  # 3.10-3.12. Each SGE cell runs the suite twice: once on the default
  # stack and once with --slow-accounting for the one test that needs it
  # (docs/dev/testbed/TESTBED_REVIEW.md D-T22); Slurm has no such variant.
  # The tests run inside the login container; the runner only needs Python
  # for the hpc-testbed driver (src/hpc_runner/_testbed.py, stdlib only),
  # which wraps docker compose.
  integration:
    needs: [lint, test]
    runs-on: ubuntu-latest
    # The Slurm suite waits out two time limits and a requeue, each over a minute.
    timeout-minutes: ${{ matrix.scheduler == 'slurm' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/main') && '["3.10", "3.11", "3.12"]' || '["3.12"]') }}
        scheduler: [sge]
        flavour: [soge]
        include:
          - python: "3.12"
            scheduler: sge
            flavour: ocs
          - python: "3.12"
            scheduler: slurm
            flavour: "24.11"
          - python: "3.12"
            scheduler: slurm
            flavour: "22.05"
    env:
      TESTBED: hpc-testbed --scheduler ${{ matrix.scheduler }} --flavour ${{ matrix.flavour }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the testbed driver
        run: pip install -e .

      - name: Start the ${{ matrix.scheduler }} ${{ matrix.flavour }} stack
        run: $TESTBED up

      - name: Integration tests (${{ matrix.scheduler }} ${{ matrix.flavour }}, Python ${{ matrix.python }})
        run: >
          $TESTBED pytest --py ${{ matrix.python }}
          --junit testbed/junit-${{ matrix.python }}-default.xml

      - name: Restart the stack with slow accounting
        if: matrix.scheduler == 'sge'
        run: |
          $TESTBED down
          $TESTBED up --slow-accounting

      - name: Slow-accounting tests (${{ matrix.flavour }}, Python ${{ matrix.python }})
        if: matrix.scheduler == 'sge'
        run: $TESTBED pytest --py ${{ matrix.python }} --slow-accounting

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.flavour }}-${{ matrix.python }}
          path: testbed/junit-*.xml
          if-no-files-found: ignore

      # A container is <compose project>-<service>; the project has the
      # flavour's dot as a dash (hpc-testbed-slurm-24-11). `db` is Slurm's only.
      - name: Collect cluster logs
        if: failure()
        run: |
          mkdir -p testbed-logs
          $TESTBED logs > testbed-logs/compose.log 2>&1 || true
          project="hpc-testbed-${{ matrix.scheduler }}-$(echo '${{ matrix.flavour }}' | tr . -)"
          for c in master exec1 exec2 login; do
            docker cp "$project-$c:/var/log/testbed.log" "testbed-logs/$c-testbed.log" || true
          done

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testbed-logs-${{ matrix.flavour }}-${{ matrix.python }}
          path: testbed-logs/
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: $TESTBED down
