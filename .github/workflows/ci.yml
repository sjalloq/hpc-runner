name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/hpc_runner tests

      - name: Ruff format
        run: ruff format --check src/hpc_runner tests

      - name: Mypy
        run: mypy src/hpc_runner

      # The docs build is part of lint: warnings (broken references, bad
      # markup) fail the build, as in the Pages workflow.
      - name: Docs
        run: make -C docs html SPHINXOPTS="-W --keep-going"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for hatch-vcs

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install environment-modules
        run: sudo apt-get update && sudo apt-get install -y environment-modules

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # Placeholder: end-to-end tests against a real scheduler (an SGE container
  # running the submit/status/cancel/dependency paths). Disabled until the
  # test cluster exists; see TESTBED_PLAN.md for the plan.
  integration:
    if: false
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: echo "integration tests not yet implemented; see TESTBED_PLAN.md" && exit 1
