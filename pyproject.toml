[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hpc-runner"
dynamic = ["version"]
description = "Unified HPC job submission across multiple schedulers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Shareef Jalloq"}
]
keywords = ["hpc", "slurm", "sge", "pbs", "cluster", "job-submission"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "rich-click>=1.7",
    "jinja2>=3.0",
    "tomli>=2.0; python_version < '3.11'",
    "textual>=6.11",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
]
dev = [
    "hpc-runner[test]",
    "mypy>=1.19",
    "ruff>=0.15",
    "sphinx>=7.0",
    "furo>=2024.0.0",
    "build",
    "twine",
    "hatch-vcs",
    "pre-commit",
]
all = [
    "hpc-runner[dev]",
]

[project.scripts]
hpc = "hpc_runner.cli.main:main"
# Developer tool: drives the Docker scheduler testbed from a checkout
# (testbed/README.md). Stdlib only; a no-op without the repository.
hpc-testbed = "hpc_runner._testbed:main"

[project.urls]
Homepage = "https://github.com/sjalloq/hpc-runner"
Repository = "https://github.com/sjalloq/hpc-runner"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/hpc_runner/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_runner"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live scheduler testbed (see docs/dev/testbed/TESTBED_PLAN.md)",
    "flavour(*names): only holds on the listed scheduler flavours; deselected elsewhere",
    "slow_accounting: needs the master from `hpc-testbed up --slow-accounting`; run with --slow-accounting",
]
# -r sxX: every skip, xfail and xpass is listed in the summary so a quietly
# shrinking suite is visible in the log.
addopts = "-m 'not integration' -r sxX"
