# hpc-runner default configuration

[defaults]
scheduler = "auto"
cpu = 1
mem = "4G"
time = "1:00:00"
inherit_env = true
modules_path = []          # 'module use <path>' (searched first)
modules_path_append = []   # 'module use --append <path>' (searched last)
modules = []

# SGE-specific settings
[schedulers.sge]
parallel_environment = "smp"
memory_resource = "mem_free"
time_resource = "h_rt"
merge_output = true

# Module handling
purge_modules = true        # Run 'module purge' before loading modules
silent_modules = false      # Use -s flag for silent module operations
module_init_script = ""     # Site-specific module init (empty = auto-detect)

# Environment handling
expand_makeflags = true     # Expand $NSLOTS in MAKEFLAGS
unset_vars = []             # Environment variables to unset (e.g., ["https_proxy"])

# Local scheduler settings
[schedulers.local]
purge_modules = true
silent_modules = false
module_init_script = ""

# Slurm-specific settings (for future use)
[schedulers.slurm]
# Default Slurm settings

# Tool configurations
[tools.xterm]
queue = "interactive"
time = "4:00:00"

[tools.make]
# Inherit defaults

[tools.python]
modules = ["python"]

# Named job types
[types.interactive]
queue = "interactive"
time = "8:00:00"
inherit_env = true

[types.gpu]
queue = "gpu"
resources = [{name = "gpu", value = 1}]

[types.mpi]
nodes = 2
tasks = 32
