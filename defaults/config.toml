config_version = 1

# hpc-runner default configuration

[defaults]
cpu = 1
mem = "4G"
time = "1:00:00"
inherit_env = true
modules_path = []          # 'module use <path>' (searched first)
modules_path_append = []   # 'module use --append <path>' (searched last)
modules = []
env_unset = []             # Environment variables to unset in jobs (e.g., ["https_proxy"])
env_passthrough = []       # With inherit_env = false: submit-host variables to pass (e.g., ["DISPLAY"])

# SGE-specific settings
[schedulers.sge]
parallel_environment = "smp"
memory_resource = "mem_free"
time_resource = "h_rt"
# Emulate afterok/afternotok with exit-code sentinels in a shared directory
# (SGE -hold_jid alone is afterany). false: only afterany dependencies work.
emulate_afterok = true

# Module handling ('module purge' always runs first)
module_init_script = ""     # Site-specific module init (empty = auto-detect)
module_system = ""          # "modules" (Environment Modules), "lmod" or "" (unknown)

# Local scheduler settings
[schedulers.local]
module_init_script = ""
module_system = ""

# Slurm-specific settings (for future use)
[schedulers.slurm]
# Default Slurm settings

# Tool configurations
[tools.xterm]
queue = "interactive"
time = "4:00:00"

[tools.make]
# ${hpc.cpus} is rendered by the scheduler: $NSLOTS on SGE.
env_vars = { MAKEFLAGS = "-j${hpc.cpus}" }

[tools.python]
modules = ["python"]

# Named job types
[types.gpu]
queue = "gpu"
resources = [{name = "gpu", value = 1}]

[types.mpi]
nodes = 2
tasks = 32
