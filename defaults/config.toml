config_version = 1

# hpc-runner default configuration

# The one scheduler this installation submits to (sge, or local to run jobs
# on this machine). Required: hpc-runner never guesses. HPC_SCHEDULER in the
# environment overrides it.
scheduler = "sge"

# Script every job sources to define `module` on the compute nodes. Empty
# tries the standard Environment Modules locations. A node fact, so it is set
# once here, not per scheduler.
module_init_script = ""

[defaults]
cpu = 1
mem = "4G"                 # per job (D10): 16G, 4096M, 1.5GiB, ...
time = "1:00:00"           # HH:MM:SS, D-HH:MM:SS or 90s, 30m, 4h, 2d, 1h30m
# Output file, relative to the working directory. ${hpc.*} values are filled
# in by the scheduler; array jobs get .${hpc.task_id} appended unless used.
# stderr is merged into stdout unless a stderr pattern is set.
stdout = "${hpc.job_name}.${hpc.job_id}.out"
inherit_env = true
modules_path = []          # 'module use <path>' (searched first)
modules_path_append = []   # 'module use --append <path>' (searched last)
modules = []
env_unset = []             # Environment variables to unset in jobs (e.g., ["https_proxy"])
env_passthrough = []       # With inherit_env = false: submit-host variables to pass (e.g., ["DISPLAY"])

# SGE-specific settings
[schedulers.sge]
parallel_environment = "smp"
memory_resource = "mem_free"
time_resource = "h_rt"
# "slot": memory_resource is consumed per slot, so mem is divided by cpu;
# "job": it is requested for the whole job as given.
memory_per = "slot"
# Emulate afterok/afternotok with exit-code sentinels in a shared directory
# (SGE -hold_jid alone is afterany). false: only afterany dependencies work.
emulate_afterok = true


# Local scheduler: no settings
[schedulers.local]

# Slurm-specific settings (for future use)
[schedulers.slurm]
# Default Slurm settings

# Tool configurations
[tools.xterm]
queue = "interactive"
time = "4:00:00"

[tools.make]
# ${hpc.cpus} is rendered by the scheduler: $NSLOTS on SGE.
env_vars = { MAKEFLAGS = "-j${hpc.cpus}" }

[tools.python]
modules = ["python"]

# Named job types
[types.gpu]
queue = "gpu"
resources = [{name = "gpu", value = 1}]
